[project]
name = "aml-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.2",
    "kagglehub>=1.0.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
